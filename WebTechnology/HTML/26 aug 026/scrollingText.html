<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrolling</title>
  </head>
  <body>
    <h1>Scrolling Text</h1>
    <hr color="green" />
    <marquee behavior="" direction="">This is Marquee Tag</marquee>
    <marquee behavior="scroll" direction="left">This is Marquee Tag</marquee>
    <marquee behavior="" direction="right">This is Marquee Tag</marquee>
    <marquee behavior="" direction="up">This is Marquee Tag</marquee>
    <marquee behavior="" direction="down">This is Marquee Tag</marquee>

    <marquee behavior="scroll" direction="right">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSo3iJKBxEC46N_ejh1UwayWvVKK3m_Tg1uL6tSt36eWFacRSK6gphaR9I&s=10" alt="helicopter">
    </marquee>
  </body>
</html>
