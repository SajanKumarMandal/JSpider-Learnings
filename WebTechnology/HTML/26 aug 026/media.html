<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Insertion</title>
    <style>
      body {
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h1>HTML MEDIA TAG</h1>
    <video
      src="https://www.pexels.com/download/video/19473270/"
      width="80%"
      muted
      controls
      poster="https://images.pexels.com/photos/7135013/pexels-photo-7135013.jpeg"
    >
      Video File is not supported
    </video>

    <audio
      src="./assets/audio/sigmamusicart-no-copyright-music-537751.mp3"
      controls
      loop
      muted
    ></audio>

    <script>
        const vid = document.querySelector('video')
        vid.onmouseenter = ()=>{
           vid.play()
        }
        vid.onmouseleave = ()=> {
            vid.pause()
        }
    </script>
  </body>
</html>
