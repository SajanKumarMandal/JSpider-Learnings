<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image</title>
  </head>
  <body>
    <!-- 
    TO insert Image we call <img> tag 
     It is unpaired , Void element 
     Syntax :
     <img src = '' alt = ''>
     
     Attributes : 
     1. src : source (name/path/url)
     2. alt : Alternative Name 
     3. title :
     4. height : px , %
     5. width : px , %
      -->
    <!-- Inserting Image By link -->

    <img
      src="https://www.gstatic.com/webp/gallery/5.webp"
      alt="Image"
      height="20%"
      style="object-fit: cover"
    />
    <!-- Insert Image by Path  -->
    <img
      src="../../../../Downloads/Ganesha.png"
      alt="Lord Ganesha"
      height="20%"
      style="object-fit: cover"
    />
  </body>
</html>
